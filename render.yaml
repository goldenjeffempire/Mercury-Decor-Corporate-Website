services:
  - type: web
    name: mercury-decor-limited
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile && BASE_PATH=/ pnpm --filter @workspace/mercury-decor run build
    staticPublishPath: artifacts/mercury-decor/dist/public
    envVars:
      - key: NODE_VERSION
        value: "22"
    routes:
      - type: rewrite
        source: /about
        destination: /about/index.html
      - type: rewrite
        source: /services
        destination: /services/index.html
      - type: rewrite
        source: /catalogs
        destination: /catalogs/index.html
      - type: rewrite
        source: /industries
        destination: /industries/index.html
      - type: rewrite
        source: /contact
        destination: /contact/index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /project-gallery-watermarked/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /project-videos/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /video/*
        name: Cache-Control
        value: public, max-age=31536000, immutable